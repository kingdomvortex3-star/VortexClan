
name: VortexClan Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VortexClan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Plugin
        run: gradle build --no-daemon

      - name: Upload VortexClan JAR
        uses: actions/upload-artifact@v4
        with:
          name: VortexClan
          path: build/libs/VortexClan.jar
          if-no-files-found: error
