
name: VortexClan
version: 1.0.0
main: id.vortexclan.VortexClan
api-version: '26.3'
author: VortexTeam
description: Advanced Clan System

softdepend:
  - Vault
  - PlaceholderAPI

commands:
  clan:
    description: Main VortexClan command
    usage: /clan
    aliases:
      - c

  cc:
    description: Clan Chat shortcut
    usage: /cc <message>

permissions:
  vortexclan.use:
    default: true

  vortexclan.create:
    default: true

  vortexclan.admin:
    default: op

  vortexclan.admin.reload:
    default: op
